version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./evalforge.db
      - MUBIT_API_KEY=${MUBIT_API_KEY: mbt_mw-app_157a543dbd714568_8ef71cb4b4924cc0bc3a25c70893d9a2208113bca198467cb57969b615715bf4}
      - MUBIT_ANTHROPIC_BASE_URL=https://api.mubit.ai/anthropic
      - MUBIT_ANTHROPIC_MODEL=claude-haiku-4-5
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
