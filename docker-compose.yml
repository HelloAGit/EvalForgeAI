services:
  evalforgeai:
    build: .
    image: evalforgeai:local
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/evalforge.db
      # Supplied from your shell or an untracked .env file; never committed.
      - MUBIT_API_KEY=${MUBIT_API_KEY:-}
      - MUBIT_ANTHROPIC_BASE_URL=${MUBIT_ANTHROPIC_BASE_URL:-https://api.mubit.ai/anthropic}
      - MUBIT_ANTHROPIC_MODEL=${MUBIT_ANTHROPIC_MODEL:-claude-haiku-4-5}
    volumes:
      - evalforge-data:/app/data

volumes:
  evalforge-data:
